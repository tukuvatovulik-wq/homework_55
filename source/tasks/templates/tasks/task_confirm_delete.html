{% extends "base.html" %}
{% block title %}Удаление задачи{% endblock %}
{% block content %}
<h1>Удаление задачи</h1>
<p>Вы действительно хотите удалить задачу «{{ task.description }}»?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{% url 'tasks:detail' task.pk %}">Отмена</a>
</form>
{% endblock %}
